steps:
  # Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["build", "-t", "europe-docker.pkg.dev/truefilter-10000/llm-ws/main", "."]
  # Push the container image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "europe-docker.pkg.dev/truefilter-10000/llm-ws/main"]
images:
  - "europe-docker.pkg.dev/truefilter-10000/llm-ws/main"
